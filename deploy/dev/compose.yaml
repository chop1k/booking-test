services:
  polling:
    build:
      dockerfile: ./polling.Dockerfile

    env_file:
      - .env.dev.local

    volumes:
      - ./bin/polling:/app/polling

    depends_on:
      - nginx

    networks:
      - app_network

  postgres:
    image: postgres:18-alpine

    env_file:
      - .env.dev.local

    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app_network

  valkey:
    image: valkey/valkey:9.1.1-alpine
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_network

  app:
    build:
      dockerfile: ./app.Dockerfile

    env_file:
      - .env.dev.local

    volumes:
      - .:/app

    networks:
      - app_network

  nginx:
    image: nginx:1.29-alpine

    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres-data:
  valkey-data: