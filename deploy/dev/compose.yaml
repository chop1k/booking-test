services:
  polling:
    build:
      dockerfile: ./polling.Dockerfile

    env_file:
      - .env.dev.local

    depends_on:
      - nginx

    networks:
      - app_network

  app:
    build:
      dockerfile: ./app.Dockerfile

    expose:
      - "9000"

    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: sqlite:///app/var/data/database.sqlite

    volumes:
      - .:/app
      - app-data:/app/var/data

    networks:
      - app_network

  nginx:
    image: nginx:1.29-alpine

    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./deploy/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app-data: