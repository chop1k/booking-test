services:
  app:
    build: .

    expose:
      - "9000"

    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: sqlite:///app/var/data/database.sqlite

    volumes:
      - static-files:/app/public/assets
      - app-data:/app/var/data

    networks:
      - app_network

  nginx:
    image: nginx:1.29-alpine

    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - static-files:/app/public/assets:ro
      - ./deploy/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app-data:
  static-files: