services:
  polling:
    build:
      dockerfile: ./polling.Dockerfile

    env_file:
      - .env.prod.local

    depends_on:
      - nginx

    networks:
      - app_network

  app:
    build:
      dockerfile: ./app.Dockerfile

    expose:
      - "9000"

    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: sqlite:///app/var/data/database.sqlite

    volumes:
      - static-files:/app/public/assets
      - app-data:/app/var/data

    networks:
      - app_network

  nginx:
    image: nginx:1.29-alpine

    depends_on:
      - app

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - static-files:/app/public/assets:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app-data:
  static-files: