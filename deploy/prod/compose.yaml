services:
  polling:
    build:
      dockerfile: ./polling.Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod.local

    depends_on:
      - nginx

    networks:
      - app_network

  postgres:
    image: postgres:18-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

    env_file:
      - .env.prod.local

    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

    networks:
      - app_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      dockerfile: ./app.Dockerfile

    env_file:
      - .env.prod.local

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - static-files:/app/public/assets
      - app-data:/app/var/data

    networks:
      - app_network

  nginx:
    image: nginx:1.29-alpine

    depends_on:
      - app

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - static-files:/app/public/assets:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fullchain.pem:/etc/nginx/ssl/fullchain.pem
      - ./privkey.pem:/etc/nginx/ssl/privkey.pem

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app-data:
  static-files:
  postgres-data: