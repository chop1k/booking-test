monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event"]

when@staging:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: info
                handler: json_stream
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50
            json_stream:
                type: stream
                path: php://stdout
                level: info
                formatter: monolog.formatter.json
            alert:
                type: fingers_crossed
                action_level: error
                handler: alert_stream
                formatter: monolog.formatter.json
            alert_stream:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json